<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>iFace logo options · round 2</title>
<style>
  :root { font-family: Inter, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #f4f4f5; padding: 32px; color: #0a0a0a; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .lead { margin-top: 6px; color: #52525b; font-size: 14px; }
  .grid { margin-top: 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .card { border-radius: 16px; overflow: hidden; border: 1px solid #e4e4e7; display: grid; grid-template-columns: 1fr 1fr; }
  .pane { padding: 22px; display: flex; flex-direction: column; gap: 18px; }
  .light { background: #fff; }
  .dark { background: #0a0a0b; color: #fafafa; }
  .title { font-size: 15px; font-weight: 600; }
  .desc { font-size: 12px; line-height: 18px; color: #71717a; margin-top: 2px; min-height: 36px; }
  .row { display: flex; align-items: flex-end; gap: 16px; }
  .row svg { display: block; }
  .size { font-size: 10px; color: #a1a1aa; text-align: center; margin-top: 4px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; padding: 8px 10px; border-radius: 10px; }
  .light .brand { background: #fafafa; border: 1px solid #ebebeb; }
  .dark .brand { background: #111113; border: 1px solid #232326; }
  .tab { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 6px 10px; border-radius: 8px 8px 0 0; width: fit-content; }
  .light .tab { background: #f4f4f5; }
  .dark .tab { background: #1a1a1d; }
</style>
</head>
<body>
  <h1>iFace Logo 方案 · 第二轮（基于 B 发散）</h1>
  <p class="lead">保留「黄色 + 墨镜 + 微笑」这几个元素，做减法、换构图。每个方案展示 App 图标、favicon、侧边栏品牌位，浅色 / 深色。</p>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <!-- Classic D-shaped lenses: flat top, round bottom. -->
      <g id="d-lenses">
        <path d="M13 25h18v1.5a9 9 0 0 1-18 0z" />
        <path d="M33 25h18v1.5a9 9 0 0 1-18 0z" />
        <rect x="11" y="24" width="42" height="3.2" rx="1.6" />
      </g>

      <!-- B1 · 一体墨镜 -->
      <symbol id="b1" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="30" fill="#ffc933" />
        <path d="M12 24.5h40v4.5c0 5.2-4.2 9-9.2 9h-1.6c-3 0-5.6-1.6-7.2-4.2-1.6 2.6-4.2 4.2-7.2 4.2h-1.6c-5 0-9.2-3.8-9.2-9z" fill="#1c1917" />
        <path d="M26 47q6 4 12 0" fill="none" stroke="#1c1917" stroke-width="3.4" stroke-linecap="round" />
      </symbol>

      <!-- B2 · 只有墨镜 -->
      <symbol id="b2" viewBox="0 0 64 64">
        <rect width="64" height="64" rx="18" fill="#ffc933" />
        <g transform="translate(0 4)" fill="#1c1917"><use href="#d-lenses" /></g>
        <path d="M18 31.5l4-3" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".55" />
      </symbol>

      <!-- B3 · 酷笑（斜嘴） -->
      <symbol id="b3" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="30" fill="#ffc933" />
        <g fill="#1c1917"><use href="#d-lenses" /></g>
        <path d="M17.5 28.5l4-3M37.5 28.5l4-3" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity=".5" />
        <path d="M27 46.5q7.5 3.5 13-2.5" fill="none" stroke="#1c1917" stroke-width="3.4" stroke-linecap="round" />
      </symbol>

      <!-- B4 · 夜间（黄色镜片） -->
      <symbol id="b4" viewBox="0 0 64 64">
        <rect width="64" height="64" rx="16" fill="#1c1917" />
        <g fill="#ffc933"><use href="#d-lenses" /></g>
        <path d="M25 44q7 5 14 0" fill="none" stroke="#ffc933" stroke-width="3.4" stroke-linecap="round" />
      </symbol>

      <!-- B5 · 线条 -->
      <symbol id="b5" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="30" fill="#ffc933" />
        <g fill="none" stroke="#1c1917" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round">
          <path d="M14 25.5h16v1a8 8 0 0 1-16 0zM34 25.5h16v1a8 8 0 0 1-16 0zM30 26.5q2-1.6 4 0" />
          <path d="M25 44.5q7 5 14 0" />
        </g>
      </symbol>

      <!-- B6 · 大墨镜方块 -->
      <symbol id="b6" viewBox="0 0 64 64">
        <rect width="64" height="64" rx="16" fill="#ffc933" />
        <g fill="#1c1917">
          <path d="M6 20h24v3a12 12 0 0 1-24 0z" />
          <path d="M34 20h24v3a12 12 0 0 1-24 0z" />
          <rect x="4" y="18.5" width="56" height="4" rx="2" />
        </g>
        <path d="M11 27l5-4M39 27l5-4" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".5" />
        <path d="M27 46q5 3.5 10 0" fill="none" stroke="#1c1917" stroke-width="3.4" stroke-linecap="round" />
      </symbol>
    </defs>
  </svg>

  <div class="grid" id="grid"></div>

  <script>
    const options = [
      { id: 'b1', title: 'B1 · 一体墨镜', desc: '两片镜片合成一整块护目镜轮廓，嘴巴缩成一道短弧。剪影最简洁，16px 也认得出。' },
      { id: 'b2', title: 'B2 · 只有墨镜', desc: '去掉脸和嘴，只留一副墨镜放在黄色圆角方块上。最克制，像一个符号而不是表情。' },
      { id: 'b3', title: 'B3 · 酷笑', desc: '经典 D 形镜片 + 一道微微上扬的斜嘴，多了一点“我早就会了”的从容。' },
      { id: 'b4', title: 'B4 · 夜间', desc: '反过来：深色底，墨镜和笑容是黄色的，像镜片在发光。和暗色界面很搭。' },
      { id: 'b5', title: 'B5 · 线条', desc: '黄色圆形里用等粗线条画出墨镜和微笑，更轻、更像精致的图标而不是 emoji。' },
      { id: 'b6', title: 'B6 · 大墨镜', desc: '墨镜放大到几乎撑满方块，嘴巴很小。构图夸张，有海报感，辨识度最高。' },
    ]
    const icon = (o, size) => `<svg width="${size}" height="${size}"><use href="#${o.id}"/></svg>`
    const pane = (o, theme) => `
      <div class="pane ${theme}">
        ${theme === 'light' ? `<div><p class="title">${o.title}</p><p class="desc">${o.desc}</p></div>` : '<div style="height:0"></div>'}
        <div class="row">
          <div>${icon(o, 96)}<p class="size">App</p></div>
          <div>${icon(o, 48)}<p class="size">48</p></div>
          <div>${icon(o, 32)}<p class="size">32</p></div>
          <div>${icon(o, 16)}<p class="size">16</p></div>
        </div>
        <div class="brand">${icon(o, 22)}iFace</div>
        <div class="tab">${icon(o, 14)}iFace · 面试题库</div>
      </div>`
    document.getElementById('grid').innerHTML = options
      .map((o) => `<div class="card">${pane(o, 'light')}${pane(o, 'dark')}</div>`)
      .join('')
  </script>
</body>
</html>

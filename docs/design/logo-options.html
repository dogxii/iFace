<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>iFace logo options · round 2</title>
<style>
  :root { font-family: Inter, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #f4f4f5; padding: 32px; color: #0a0a0a; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .lead { margin-top: 6px; color: #52525b; font-size: 14px; }
  .grid { margin-top: 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .card { border-radius: 16px; overflow: hidden; border: 1px solid #e4e4e7; display: grid; grid-template-columns: 1fr 1fr; }
  .pane { padding: 22px; display: flex; flex-direction: column; gap: 18px; }
  .light { background: #fff; }
  .dark { background: #0a0a0b; color: #fafafa; }
  .title { font-size: 15px; font-weight: 600; }
  .desc { font-size: 12px; line-height: 18px; color: #71717a; margin-top: 2px; min-height: 36px; }
  .row { display: flex; align-items: flex-end; gap: 16px; }
  .row svg { display: block; }
  .size { font-size: 10px; color: #a1a1aa; text-align: center; margin-top: 4px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; padding: 8px 10px; border-radius: 10px; }
  .light .brand { background: #fafafa; border: 1px solid #ebebeb; }
  .dark .brand { background: #111113; border: 1px solid #232326; }
  .tab { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 6px 10px; border-radius: 8px 8px 0 0; width: fit-content; }
  .light .tab { background: #f4f4f5; }
  .dark .tab { background: #1a1a1d; }
</style>
</head>
<body>
  <h1>iFace Logo 方案 · 第三轮（俏皮 / 大胆）</h1>
  <p class="lead">不再端正戴墨镜：滑下来、推上去、歪着戴……每个都有一点小表情和小故事。</p>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <clipPath id="tile"><rect width="64" height="64" rx="16" /></clipPath>

      <!-- C1 · 墨镜滑落，眼睛偷看 -->
      <symbol id="c1" viewBox="0 0 64 64">
        <rect width="64" height="64" rx="16" fill="#ffc933" />
        <ellipse cx="22" cy="24" rx="6.5" ry="7.2" fill="#fff" />
        <ellipse cx="42" cy="24" rx="6.5" ry="7.2" fill="#fff" />
        <circle cx="24" cy="21.8" r="3.1" fill="#1c1917" />
        <circle cx="44" cy="21.8" r="3.1" fill="#1c1917" />
        <g transform="rotate(-7 32 34)" fill="#1c1917">
          <path d="M11 29h19.5v1.5a9.75 9.75 0 0 1-19.5 0z" />
          <path d="M33.5 29H53v1.5a9.75 9.75 0 0 1-19.5 0z" />
          <rect x="8" y="27.4" width="48" height="3.4" rx="1.7" />
        </g>
        <path d="M14.5 34.5l3.5-3M37 32l3.5-3" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".5" />
        <path d="M27.5 50.5q5.5 3 11-1.5" fill="none" stroke="#1c1917" stroke-width="3.4" stroke-linecap="round" />
      </symbol>

      <!-- C2 · 墨镜推上头顶，眨眼 -->
      <symbol id="c2" viewBox="0 0 64 64">
        <rect width="64" height="64" rx="16" fill="#ffc933" />
        <g transform="rotate(8 32 13)" fill="#1c1917">
          <path d="M14 11h15v1a7.5 7.5 0 0 1-15 0z" />
          <path d="M35 11h15v1a7.5 7.5 0 0 1-15 0z" />
          <rect x="12" y="9.6" width="40" height="3" rx="1.5" />
        </g>
        <path d="M16.5 33q5-5 10 0" fill="none" stroke="#1c1917" stroke-width="3.4" stroke-linecap="round" />
        <ellipse cx="42" cy="31" rx="3.4" ry="4.4" fill="#1c1917" />
        <path d="M21 41h22a11 11 0 0 1-22 0z" fill="#1c1917" />
        <path d="M27.5 47.6a6 4 0 0 1 9 0 9.6 9.6 0 0 1-9 0z" fill="#fb7185" />
      </symbol>

      <!-- C3 · 面试官挑眉 -->
      <symbol id="c3" viewBox="0 0 64 64">
        <rect width="64" height="64" rx="16" fill="#ffc933" />
        <path d="M37 14.5q6.5-4.5 13 0" fill="none" stroke="#1c1917" stroke-width="3.2" stroke-linecap="round" />
        <ellipse cx="43.5" cy="24" rx="5.6" ry="6" fill="#fff" />
        <circle cx="42.5" cy="25" r="2.8" fill="#1c1917" />
        <g transform="rotate(14 32 30)" fill="#1c1917">
          <path d="M11 28h19v1.5a9.5 9.5 0 0 1-19 0z" />
          <path d="M34 28h19v1.5a9.5 9.5 0 0 1-19 0z" />
          <rect x="9" y="26.4" width="46" height="3.4" rx="1.7" />
        </g>
        <path d="M14.5 31.5l3.5-3" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".5" />
        <path d="M26 50l12-2.5" fill="none" stroke="#1c1917" stroke-width="3.4" stroke-linecap="round" />
      </symbol>

      <!-- C4 · i 的点是一张脸 -->
      <symbol id="c4" viewBox="0 0 64 64">
        <rect width="64" height="64" rx="16" fill="#1c1917" />
        <rect x="25.5" y="35" width="13" height="21" rx="6.5" fill="#fafafa" />
        <circle cx="32" cy="19" r="13" fill="#ffc933" />
        <g transform="rotate(-8 32 18)" fill="#1c1917">
          <path d="M21.5 16h9v.8a4.5 4.5 0 0 1-9 0zM33.5 16h9v.8a4.5 4.5 0 0 1-9 0z" />
          <rect x="20" y="15" width="24" height="2.2" rx="1.1" />
        </g>
        <path d="M28.5 25q3.5 2 7 0" fill="none" stroke="#1c1917" stroke-width="2.2" stroke-linecap="round" />
      </symbol>

      <!-- C5 · 从底下探头 -->
      <symbol id="c5" viewBox="0 0 64 64">
        <rect width="64" height="64" rx="16" fill="#ffc933" />
        <circle cx="21" cy="25" r="7.5" fill="#fff" />
        <circle cx="43" cy="25" r="7.5" fill="#fff" />
        <circle cx="23" cy="22.5" r="3.6" fill="#1c1917" />
        <circle cx="45" cy="22.5" r="3.6" fill="#1c1917" />
        <path d="M8 33h48v3.5c0 6.4-5.1 11.5-11.5 11.5h-1.6c-4 0-7.4-2.2-8.9-5.6-1.5 3.4-4.9 5.6-8.9 5.6h-1.6C14.1 48 9 42.9 9 36.5z" fill="#1c1917" transform="rotate(-6 32 40)" />
      </symbol>

      <!-- C6 · 贴纸（歪头吐舌） -->
      <symbol id="c6" viewBox="0 0 64 64">
        <g transform="rotate(-12 32 32)">
          <circle cx="32" cy="32" r="28" fill="#ffc933" stroke="#fff" stroke-width="3.5" />
          <ellipse cx="22.5" cy="23.5" rx="5.6" ry="6" fill="#fff" />
          <ellipse cx="41.5" cy="23.5" rx="5.6" ry="6" fill="#fff" />
          <circle cx="23" cy="21.2" r="2.7" fill="#1c1917" />
          <circle cx="42" cy="21.2" r="2.7" fill="#1c1917" />
          <g transform="rotate(4 32 31)" fill="#1c1917">
            <path d="M12 28.5h18v1a9 9 0 0 1-18 0zM34 28.5h18v1a9 9 0 0 1-18 0z" />
            <rect x="10" y="27" width="44" height="3.3" rx="1.65" />
          </g>
          <path d="M24 45.5q8 5 16 0" fill="none" stroke="#1c1917" stroke-width="3.4" stroke-linecap="round" />
          <path d="M33 47.6h6v2.4a3 3 0 0 1-6 0z" fill="#fb7185" />
        </g>
      </symbol>
    </defs>
  </svg>

  <div class="grid" id="grid"></div>

  <script>
    const options = [
      { id: 'c1', title: 'C1 · 偷看', desc: '墨镜滑到鼻梁、歪一点，眼睛从镜框上方往外瞄——“这题我好像见过”。' },
      { id: 'c2', title: 'C2 · 眨眼', desc: '墨镜推到头顶，一只眼眨一下，咧嘴露出舌头。最开朗，适合“轻松刷题”的气质。' },
      { id: 'c3', title: 'C3 · 面试官挑眉', desc: '墨镜歪着挂，一边镜片滑下来，露出挑起的眉毛和眼睛，嘴角一撇——“嗯？再说说？”' },
      { id: 'c4', title: 'C4 · i 的点', desc: '推翻方案：一个小写 i，上面的点是戴墨镜的小黄脸。图标即字母，品牌名一眼就有。' },
      { id: 'c5', title: 'C5 · 偷看（极简）', desc: 'C1 的减法版：去掉嘴，只剩一块滑下来的一体墨镜和上方两只大眼睛。像一个符号，16px 也成立。' },
      { id: 'c6', title: 'C6 · 贴纸', desc: '白边贴纸感，整张脸歪着，墨镜滑下来露出眼睛，吐一点舌头。最俏皮，像表情包。' },
    ]
    const icon = (o, size) => `<svg width="${size}" height="${size}"><use href="#${o.id}"/></svg>`
    const pane = (o, theme) => `
      <div class="pane ${theme}">
        ${theme === 'light' ? `<div><p class="title">${o.title}</p><p class="desc">${o.desc}</p></div>` : '<div style="height:0"></div>'}
        <div class="row">
          <div>${icon(o, 96)}<p class="size">App</p></div>
          <div>${icon(o, 48)}<p class="size">48</p></div>
          <div>${icon(o, 32)}<p class="size">32</p></div>
          <div>${icon(o, 16)}<p class="size">16</p></div>
        </div>
        <div class="brand">${icon(o, 22)}iFace</div>
        <div class="tab">${icon(o, 14)}iFace · 面试题库</div>
      </div>`
    document.getElementById('grid').innerHTML = options
      .map((o) => `<div class="card">${pane(o, 'light')}${pane(o, 'dark')}</div>`)
      .join('')
  </script>
</body>
</html>
